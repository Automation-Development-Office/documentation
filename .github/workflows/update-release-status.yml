name: Update release status

on:
  schedule:
    # Nightly at 06:00 UTC — refresh Releases board + auto-fill deployments.yml
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release-status/products.yml"
      - "scripts/generate_release_status.py"
      - ".github/workflows/update-release-status.yml"

permissions:
  contents: write
  packages: read

concurrency:
  group: update-release-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Discover deployments and generate status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_release_status.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            release-status/deployments.yml \
            release-status/release-status.md \
            release-status/versions.json
          if git diff --staged --quiet; then
            echo "No release-status changes."
            exit 0
          fi
          git commit -m "chore(release-status): nightly refresh of releases and deploy channels"
          git push
